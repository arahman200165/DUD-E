<section class="flex h-full flex-col">
  <header class="flex items-center justify-between border-b border-border px-3 py-2">
    <h1 class="text-sm font-semibold tracking-wide text-text">{{ title() }}</h1>
    <span
      class="rounded px-1.5 py-0.5 font-mono text-[10px] uppercase tracking-wide"
      [class.text-warning]="status() === 'experimental'"
      [class.text-success]="status() === 'stable'"
      >{{ status() }}</span
    >
  </header>
  <div class="flex-1 overflow-auto p-3">
    <ng-content />
  </div>
</section>
