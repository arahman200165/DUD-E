<aside class="flex h-full w-56 flex-col border-r border-border bg-panel">
  <div class="border-b border-border px-3 py-2">
    <span class="font-mono text-xs font-bold tracking-[0.2em] text-text">DUD-E</span>
  </div>

  <nav class="flex-1 overflow-y-auto py-1">
    @for (category of categories; track category) {
      <div class="mt-1.5 first:mt-0">
        <div class="flex items-center gap-1.5 px-3 py-1">
          <span class="h-1.5 w-1.5 rounded-full" [class]="'bg-' + meta[category].colorToken"></span>
          <span class="text-[10.5px] font-semibold uppercase tracking-wider text-text-muted">{{
            meta[category].label
          }}</span>
        </div>

        @if (category === 'data') {
          <a
            routerLink="/tools/json"
            routerLinkActive="bg-panel-elevated text-text"
            class="mx-1 block rounded-sm py-1 pl-7 pr-2 text-xs text-text-muted hover:bg-panel-elevated hover:text-text"
          >
            JSON Formatter
          </a>
        } @else {
          <p class="pl-7 pr-2 text-[11px] text-text-muted/60">No tools yet</p>
        }
      </div>
    }
  </nav>
</aside>
