<app-tool-shell title="Punycode Converter" status="stable">
  <div class="flex flex-col gap-3">
    <div class="flex flex-wrap items-center gap-3 text-ui text-text-muted">
      <div class="flex overflow-hidden rounded-sm border border-border">
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'toASCII'"
          [class.text-bg]="direction() === 'toASCII'"
          [class.text-text-muted]="direction() !== 'toASCII'"
          (click)="setDirection('toASCII')"
        >
          Unicode → Punycode
        </button>
        <button
          type="button"
          class="px-2 py-0.5"
          [class.bg-accent]="direction() === 'toUnicode'"
          [class.text-bg]="direction() === 'toUnicode'"
          [class.text-text-muted]="direction() !== 'toUnicode'"
          (click)="setDirection('toUnicode')"
        >
          Punycode → Unicode
        </button>
      </div>

      <button type="button" class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="swap()">
        Swap
      </button>

      <button type="button" class="rounded-sm border border-border px-2 py-0.5 hover:bg-panel-elevated" (click)="clear()">
        Clear
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-ui text-text-muted">{{ direction() === 'toASCII' ? 'Unicode domain' : 'Punycode (ASCII) domain' }}</span>
      <input
        type="text"
        class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text focus:outline-none focus:ring-1 focus:ring-accent"
        [placeholder]="direction() === 'toASCII' ? 'münchen.de' : 'xn--mnchen-3ya.de'"
        [value]="input()"
        (input)="onInputChange($event)"
      />
    </div>

    @if (result(); as current) {
      @if (current.ok) {
        <div class="flex flex-col gap-1">
          <div class="flex items-center justify-between">
            <span class="text-ui text-text-muted">{{ direction() === 'toASCII' ? 'Punycode (ASCII) domain' : 'Unicode domain' }}</span>
            <app-copy-button [text]="current.value" />
          </div>
          <div class="w-full rounded-sm border border-border bg-panel px-2 py-1 font-mono text-xs text-text">{{ current.value }}</div>
        </div>
      } @else {
        <app-error-panel [message]="current.error" />
      }
    }
  </div>
</app-tool-shell>
