<app-tool-shell title="ELF Header Viewer" status="stable">
  <app-binary-format-viewer
    dropLabel="Drop a Linux/Unix ELF binary here, or click to browse"
    [fileName]="fileName()"
    [status]="status()"
    [errorMessage]="errorMessage()"
    [treeNodes]="treeNodes()"
    (fileSelected)="onFileSelected($event)"
    (rejected)="onRejected($event)"
  />
</app-tool-shell>
