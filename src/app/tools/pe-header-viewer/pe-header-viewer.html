<app-tool-shell title="PE Header Viewer" status="stable">
  <app-binary-format-viewer
    dropLabel="Drop a Windows PE executable (.exe/.dll) here, or click to browse"
    [fileName]="fileName()"
    [status]="status()"
    [errorMessage]="errorMessage()"
    [treeNodes]="treeNodes()"
    (fileSelected)="onFileSelected($event)"
    (rejected)="onRejected($event)"
  />
</app-tool-shell>
